name: Update video stats

on:
  schedule:
    # ~toutes les 10h (00:00, 10:00, 20:00 UTC)
    - cron: '0 0,10,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover latest videos + live from the channel, fetch all stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_HANDLE: "@Loaaannn"
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.parse, datetime

          api_key = os.environ.get("YOUTUBE_API_KEY")
          if not api_key:
              raise SystemExit("YOUTUBE_API_KEY secret is not set")
          handle = os.environ["CHANNEL_HANDLE"]

          def api(path, **params):
              params["key"] = api_key
              url = f"https://www.googleapis.com/youtube/v3/{path}?{urllib.parse.urlencode(params)}"
              with urllib.request.urlopen(url) as resp:
                  return json.load(resp)

          def parse_duration_seconds(iso):
              m = re.match(r"PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?", iso or "")
              if not m:
                  return 0
              h, mn, s = (int(x) if x else 0 for x in m.groups())
              return h * 3600 + mn * 60 + s

          def fetch_details(ids):
              """videos.list par lots de 50 id, retourne {id: item}"""
              out = {}
              for i in range(0, len(ids), 50):
                  batch = ids[i:i + 50]
                  data = api("videos", part="snippet,statistics,contentDetails,liveStreamingDetails", id=",".join(batch))
                  for item in data.get("items", []):
                      out[item["id"]] = item
              return out

          # ── 1) GRILLE "Mes travaux" — auto-détection des 2 dernières vidéos
          #    longues + du dernier live sur la chaîne, Shorts exclus ──
          ch = api("channels", part="contentDetails", forHandle=handle)
          uploads_playlist = ch["items"][0]["contentDetails"]["relatedPlaylists"]["uploads"]

          items = api("playlistItems", part="contentDetails", playlistId=uploads_playlist, maxResults=50)
          recent_ids = [it["contentDetails"]["videoId"] for it in items.get("items", [])]
          if not recent_ids:
              raise SystemExit("No videos found on channel uploads playlist")

          recent_details = fetch_details(recent_ids)

          videos, lives = [], []
          for item in recent_details.values():
              duration_s = parse_duration_seconds(item["contentDetails"].get("duration"))
              if duration_s > 0 and duration_s <= 60:
                  continue  # Shorts exclus de la grille
              entry = {
                  "id": item["id"],
                  "publishedAt": item["snippet"]["publishedAt"],
                  "viewCount": int(item["statistics"].get("viewCount", 0)),
              }
              (lives if "liveStreamingDetails" in item else videos).append(entry)

          videos.sort(key=lambda v: v["publishedAt"], reverse=True)
          lives.sort(key=lambda v: v["publishedAt"], reverse=True)

          selected = videos[:2]
          if lives:
              selected.append(lives[0])
          selected.sort(key=lambda v: v["publishedAt"], reverse=True)

          videos_out = [{"id": v["id"], "type": "live" if v in lives[:1] else "video"} for v in selected]
          stats_out = {v["id"]: {"viewCount": v["viewCount"], "publishedAt": v["publishedAt"]} for v in selected}

          with open("videos.json", "w") as f:
              json.dump(videos_out, f, indent=2, ensure_ascii=False)
              f.write("\n")

          with open("video-stats.json", "w") as f:
              json.dump({
                  "updatedAt": datetime.datetime.utcnow().isoformat() + "Z",
                  "stats": stats_out,
              }, f, indent=2, ensure_ascii=False)
              f.write("\n")

          # ── 2) BANDEAU défilant — liste manuelle (ticker-videos.json),
          #    Shorts inclus, format détecté automatiquement ──
          try:
              with open("ticker-videos.json") as f:
                  ticker_ids = json.load(f)
          except FileNotFoundError:
              ticker_ids = []

          ticker_stats = {}
          if ticker_ids:
              # réutilise ce qu'on a déjà pour les ids en commun, sinon refetch
              missing = [vid for vid in ticker_ids if vid not in recent_details]
              ticker_details = dict(recent_details)
              if missing:
                  ticker_details.update(fetch_details(missing))

              for vid in ticker_ids:
                  item = ticker_details.get(vid)
                  if not item:
                      continue
                  duration_s = parse_duration_seconds(item["contentDetails"].get("duration"))
                  if "liveStreamingDetails" in item:
                      fmt = "live"
                  elif duration_s > 0 and duration_s <= 60:
                      fmt = "short"
                  else:
                      fmt = "video"
                  ticker_stats[vid] = {
                      "viewCount": int(item["statistics"].get("viewCount", 0)),
                      "publishedAt": item["snippet"]["publishedAt"],
                      "format": fmt,
                  }

          with open("ticker-stats.json", "w") as f:
              json.dump({
                  "updatedAt": datetime.datetime.utcnow().isoformat() + "Z",
                  "stats": ticker_stats,
              }, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- videos.json video-stats.json ticker-stats.json; then
            git add videos.json video-stats.json ticker-stats.json
            git commit -m "Update tracked videos and stats"
            git push
          else
            echo "No change"
          fi
