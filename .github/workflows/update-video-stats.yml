name: Update video stats

on:
  schedule:
    # ~toutes les 10h (00:00, 10:00, 20:00 UTC)
    - cron: '0 0,10,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats from YouTube Data API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.parse, datetime

          api_key = os.environ.get("YOUTUBE_API_KEY")
          if not api_key:
              raise SystemExit("YOUTUBE_API_KEY secret is not set")

          with open("videos.json") as f:
              videos = json.load(f)
          ids = [v["id"] for v in videos]

          params = urllib.parse.urlencode({
              "part": "statistics,snippet",
              "id": ",".join(ids),
              "key": api_key,
          })
          url = f"https://www.googleapis.com/youtube/v3/videos?{params}"
          with urllib.request.urlopen(url) as resp:
              data = json.load(resp)

          stats = {}
          for item in data.get("items", []):
              vid = item["id"]
              stats[vid] = {
                  "viewCount": int(item["statistics"].get("viewCount", 0)),
                  "publishedAt": item["snippet"].get("publishedAt"),
              }

          out = {
              "updatedAt": datetime.datetime.utcnow().isoformat() + "Z",
              "stats": stats,
          }
          with open("video-stats.json", "w") as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- video-stats.json; then
            git add video-stats.json
            git commit -m "Update video stats"
            git push
          else
            echo "No stats change"
          fi
